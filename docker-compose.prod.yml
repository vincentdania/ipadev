services:
  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8091:8000"
    volumes:
      - ipadev_media:/app/media

  worker:
    build:
      context: .
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file:
      - .env.production
    depends_on:
      - redis
      - postgres
    volumes:
      - ipadev_media:/app/media

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ipadev
      POSTGRES_USER: ipadev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipadev-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipadev -d ipadev"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ipadev_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ipadev_redis:/data

volumes:
  ipadev_media:
  ipadev_postgres:
  ipadev_redis:
